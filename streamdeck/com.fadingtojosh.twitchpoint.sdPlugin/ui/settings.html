<!doctype html>
<html>
	<head lang="en">
		<title>Twitchpoint Settings</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<!-- Both settings are global: every Twitchpoint key shares one server and one poll. -->
		<sdpi-item label="Server">
			<sdpi-textfield setting="baseUrl" global placeholder="http://192.168.68.76:8080" default="http://192.168.68.76:8080"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Refresh (s)">
			<sdpi-range setting="intervalSec" global min="15" max="300" step="15" default="60" showlabels></sdpi-range>
		</sdpi-item>
		<p style="color:#a1a1aa;font-size:9pt;margin:8px 12px">
			Press any Twitchpoint key to refresh now. Twitchpoint must listen on the LAN
			(<code>"web_bind": "0.0.0.0"</code> in its config).
		</p>
	</body>
</html>
